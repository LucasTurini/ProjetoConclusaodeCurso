<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="../static/css/cadastro.css" /> <!-- Link CSS-->
    <link rel="shortcut icon" href="../static/img/Logo/logo.png" type="image/x-icon" /> <!-- Link favicon-->
    <script src="https://kit.fontawesome.com/91a34a7460.js" crossorigin="anonymous" ></script> <!-- Link fonts awesome-->
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Link fonts google-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> <!-- Link fonts google-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet"  /> <!-- Link fonts google-->
    <script src="../static/js/cadastro.js"></script> <!-- Link de script para java script-->

  </head>

  <body>
    <div class="containerPrinc">
      <div class="containerLogin">
        <div class="containerLogo">
          <img src="../static/img/Logo/logo.png" alt="Logo" class="logoLogin" />
        </div>

      <form id="signup-form" action="">
        <div class="containerDatas">
          <input type="text" placeholder="Insira seu nome:" id="name" required/>
          <div class="containerEmpty"></div>
          <input type="text" placeholder="Insira seu e-mail:" id="email" required/>
          <div class="containerEmpty"></div>
          <!-- Div vazia para separar os inputs -->
          <input type="password" placeholder="Insira sua senha:" id="password" required/>
        </div>
      </form>
        

        <div class="containerButtons">
                <button class="btnSingIn" class="btn" onclick="goToPageLogin()">CADASTRE-SE</button>
            
        </div>
      </div>
    </div>

    <footer class="footer">

      <div class="bottomFooter">
        <span>CopyRight 2024 &copy Todos os direitos Reservados</span>
      </div>
    </footer>











  </body>
</html>
